# L'installateur de l'atelier pour Windows : GrymoiR-installation.exe (./paquet-windows, Inno Setup).
# Il se télécharge depuis la page de l'exécution : Actions > installateur-windows > « Artifacts ».
# Déclenchement : à la main (Actions > installateur-windows > Run workflow), ou quand le code ou l'installateur change.
name: installateur-windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/grammaire.md'
      - 'docs/guide.md'
      - 'docs/guide/chapitre-12/**'
      - 'projets/Gestion de projet/**'
      - 'outils/windows/**'
      - 'paquet-windows'
      - 'CMakeLists.txt'
      - 'Makefile'
      - '.github/workflows/installateur-windows.yml'

jobs:
  installateur:
    name: GrymoiR-installation.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # le modèle de transcription (547 Mio, grammaire § 15.8) : téléchargé une fois par outils/modele-transcription
      - uses: actions/cache@v4
        with:
          path: ~/.cache/grymoir-modeles
          key: modele-large-v3-turbo-q5_0-e050f797
      # Inno Setup ne fait plus partie des images Windows de GitHub : on l'installe (Chocolatey).
      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-qt6-svg mingw-w64-ucrt-x86_64-qt6-multimedia mingw-w64-ucrt-x86_64-qt6-tools
      - name: Construction, essais, installateur
        shell: msys2 {0}
        run: ./paquet-windows
      - uses: actions/upload-artifact@v4
        with:
          name: GrymoiR-installation
          path: paquet/GrymoiR-installation.exe
          if-no-files-found: error
